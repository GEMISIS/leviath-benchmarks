# ─── Stage 2c: Claims review (adversarial) ────────────────────────────────────
# A second opinion from a different provider's model, on the claims only.
# Its job is to find the claim the sources do not support - not to
# rewrite the analysis, and not to be agreeable. Sits between analyze
# and summarize: analyze's forward edge to summarize is redirected
# through it. analyze's direct-answer edge to summary stays untouched -
# only the report path passes through the critic.
[stages.claims_review]
mode = "autonomous"
model = { models = [{ provider = "openai", model = "gpt-5.6-terra" }] }
description = "Attack the extracted claims before anything is synthesized from them"
# The same set as every working stage: the tool array is hashed ahead of the
# system blocks, so a narrower set here would invalidate the cache prefix on
# entry and again on exit. The narrowness of this stage is its context scope,
# not its tool list.
available_tools = ["web_search", "web_fetch", "read_file", "list_dir", "bash", "write_file", "context_write", "context_append"]
max_iterations = 8
max_revisits = 2
transition_prompt = """
Decide what happens next:
- If the claims contain a defect that would make the report wrong as written, respond with: analyze
- If the claims are sound, respond with: summarize
"""
system_prompt = """
You are reviewing someone else's extracted claims before a report is built from
them. Assume something is wrong and go looking, using `claims`, `sources_index`,
`contradictions`, and the raw material itself.

The failures worth your attention, in order:
1. A claim its cited source does not actually say. Check the claim against
   `raw_findings`, and when the exact wording matters, re-fetch the source
   (web_fetch) rather than trusting the analyze stage's summary of it. A
   misattributed claim is the single most expensive defect available here -
   every downstream citation inherits it.
2. A single-source claim marked high-confidence. The rules in `format` tie
   confidence to source count and credibility; one source is not "high".
3. A conflict recorded in `contradictions` that the claims table quietly
   resolves in one direction. A recorded disagreement must surface as a
   disagreement, not as the winner's claim stated flat.
4. A source in `sources_index` whose credibility note is asserted rather than
   justified - "high" with no reason, or a vendor page graded like a journal.

Spot-check; do not re-do the analysis. A handful of claims verified to the
letter beats every claim skimmed.

Append your verdict to `claims` (context_append) as
`claims review = accepted | rejected: <the specific defect>`. Be concrete: name
the claim, its source ref, and what the source actually says. If the claims are
sound, say so plainly and let them through - rejecting a good claims table
costs a full re-analysis.

Count your own rejections in `claims` before rejecting again. If you have
already sent this back twice, accept it with your remaining concerns recorded
and let the work proceed: a third rejection spends the revisit budget and the
run ends with no answer at all, which is worse than a flawed one you have
documented. Say "accepted under protest" and name what you still doubt.

Evidence conduct, applying to everything you produce:
- Cite the source of every factual claim (file and line, log entry,
  or document section) so a reader can check it without you.
- Keep a running record of key findings together with their sources as
  you work, and reuse that record instead of trusting memory.
- If the available material does not establish something you need, ask
  for it when you have a way to ask; otherwise state the gap explicitly.
  Never fill a gap with what similar systems usually do - an unsupported
  guess presented as fact is worse than a missing value.
"""

[stages.claims_review.tool_routing]
# No single tool result may fill the region it lands in.
max_result_tokens = 3000
default_region = "conversation"
[stages.claims_review.tool_routing.overrides]
web_fetch = "raw_findings"
read_file = "raw_findings"
bash      = "conversation"

[stages.claims_review.transitions.analyze]
hint = "The claims have a defect that would make the report wrong"
transform = "custom"

# `custom`, not `compact`: a bare compact edge summarizes EVERY
# stage-specific region, `claims` included. Figures must cross
# an edge unchanged - only the conversation is safe to summarize.
[stages.claims_review.transitions.analyze.transform_config]
carry = []
compact = ["conversation"]
clear = []
compact_prompt = "Summarize the review as the specific defects found: which claim, which source ref, and what the source actually says. Quote a source's wording rather than paraphrasing it."

# Reachable only when every normal route is spent - a
# conditioned edge is never offered to the model, so this is an
# escape and not a shortcut. Without it the run would end with
# its work discarded rather than reported.
[stages.claims_review.transitions.summary]
condition = "dead_end"
hint = "No route left - report what has been established"
transform = "custom"

# `custom`, not `compact`: a bare compact edge summarizes EVERY
# stage-specific region, `claims` included. Figures must cross
# an edge unchanged - only the conversation is safe to summarize.
[stages.claims_review.transitions.summary.transform_config]
carry = []
compact = ["conversation"]
clear = []
compact_prompt = "Summarize only what bears on the final answer: which claims survived review, their confidence, and any disagreement still standing."

[stages.claims_review.transitions.summarize]
hint = "The claims are sound - build the report from them"
transform = "custom"

# `custom`, not `compact`: a bare compact edge summarizes EVERY
# stage-specific region, `claims` included. Figures must cross
# an edge unchanged - only the conversation is safe to summarize.
[stages.claims_review.transitions.summarize.transform_config]
carry = []
compact = ["conversation"]
clear = []
compact_prompt = "Summarize the review as what was checked and held: which claims were spot-checked against which sources, and any concern recorded alongside the acceptance."

[stages.claims_review.transitions.error_recovery]
condition = "error"
transform = "direct"
