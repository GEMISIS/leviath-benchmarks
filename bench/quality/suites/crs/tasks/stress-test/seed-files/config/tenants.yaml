    webhook_retry_policy:
      max_retries: 5
      backoff_base_ms: 1000
      backoff_max_ms: 60000
      backoff_algorithm: "decorrelated_jitter"

  - tenant_id: tn-eu-central-1337
    name: "EuroTech GmbH"
    tier: enterprise
    status: active
    created_at: "2024-02-20T00:00:00+01:00"
    allowed_sources:
      - "erp-system"
      - "iot-gateway"
      - "api-proxy"
    rate_limits:
      events_per_second: 1000
      events_per_minute: 50000
      burst_multiplier: 3.0
    isolation:
      storage_prefix: "eurotech"
      queue_name: "eurotech-events"
      encryption_key_id: "kms-key-eurotech-2024"
    custom_transforms:
      - name: "gdpr_pii_redaction"
        type: "regex_replace"
        pattern: '\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b'
        replacement: "[REDACTED_EMAIL]"
      - name: "ip_anonymization"
        type: "regex_replace"
        pattern: '\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b'
        replacement: "[REDACTED_IP]"
    webhook_url: "https://eurotech.example.de/api/events/webhook"
    webhook_secret: "whsec_eurotech_prod_s3cr3t"
    webhook_retry_policy:
      max_retries: 3
      backoff_base_ms: 2000
      backoff_max_ms: 30000
      backoff_algorithm: "decorrelated_jitter"

