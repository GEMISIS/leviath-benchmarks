tenants:
  - tenant_id: tn-us-east-0042
    name: "Acme Corp"
    tier: premium
    status: active
    created_at: "2024-01-15T00:00:00-05:00"
    allowed_sources:
      - "web-app"
      - "mobile-ios"
      - "mobile-android"
      - "batch-import"
    rate_limits:
      events_per_second: 500
      events_per_minute: 25000
      burst_multiplier: 2.5
    isolation:
      storage_prefix: "acme"
      queue_name: "acme-events"
      encryption_key_id: "kms-key-acme-2024"
    webhook_url: "https://acme.example.com/webhooks/events"
