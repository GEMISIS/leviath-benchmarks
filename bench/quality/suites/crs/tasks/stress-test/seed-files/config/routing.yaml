routing:
  # Default handlers for all events
  default_handlers:
    - LogHandler
    - AnalyticsHandler

  # Handler assignment by event type pattern
  rules:
    - pattern: "*.*"
      handlers:
        - WebhookHandler
      condition: "tenant.webhook_url is not null"

    - pattern: "notification.*"
      handlers:
        - NotificationHandler
      priority: 10

    - pattern: "inventory.*"
      handlers:
        - InventoryHandler
      condition: "tenant.tier in ['premium', 'enterprise']"
      priority: 20

    - pattern: "order.created"
      handlers:
        - WebhookHandler
      priority: 30
      metadata:
        urgent: true
        timeout_override_ms: 5000

    - pattern: "payment.failed"
      handlers:
        - WebhookHandler
        - NotificationHandler
      priority: 50
      metadata:
        urgent: true
        generate_alert: true

  # Priority determines handler execution order (lower = first)
  # Default priority: 100

  # If no rule matches an event type: use default_handlers only
  # If multiple rules match: merge handler lists, deduplicate, sort by priority
