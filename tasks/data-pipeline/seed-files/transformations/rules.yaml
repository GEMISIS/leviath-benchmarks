# Event Transformation Rules

# Time window aggregations
time_windows:
  - duration: 1h
    metrics:
      - event_count_by_type
      - unique_users
      - avg_session_duration
  - duration: 1d
    metrics:
      - daily_active_users
      - event_count_by_type
      - purchase_conversion_rate

# User enrichment
user_enrichment:
  source: reference-data/users.csv
  join_key: user_id
  fields:
    - user_segment    # premium, free, trial
    - registration_date
    - country
    - lifetime_value

# Derived fields
derived_fields:
  - name: is_mobile
    expression: "device.type in ['mobile', 'tablet']"
    type: boolean

  - name: session_duration_minutes
    expression: "(session_end_time - session_start_time) / 60"
    type: float
    requires: [session_start_time, session_end_time]

  - name: is_high_value_event
    expression: "event_type == 'purchase' and properties.amount > 100"
    type: boolean

# Data quality rules
quality_rules:
  - name: future_timestamp_check
    condition: "timestamp <= current_time"
    action: reject
    error_code: QE001

  - name: duplicate_event_check
    condition: "event_id not in seen_event_ids"
    action: reject
    error_code: QE002

  - name: user_exists_check
    condition: "user_id in valid_user_ids"
    action: warn
    error_code: QW001
